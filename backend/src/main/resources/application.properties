server.port=8080
spring.application.name=jogos-retro-backend

# Permite upload de arquivos de ROMs maiores (jogos de GBA/SNES/Genesis)
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# Pasta base de armazenamento de arquivos (roms, saves, covers)
retro.storage.path=storage

# CORS permitido
retro.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Logs
logging.level.com.retro=INFO
logging.level.org.springframework.web=INFO
